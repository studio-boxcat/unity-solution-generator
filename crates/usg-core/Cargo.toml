[package]
name = "usg-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "usg_core"
path = "src/lib.rs"

# Companion binary lives in the same package — cargo idiom for "library + thin
# CLI driver" (ripgrep, fd, …). The `CARGO_BIN_EXE_unity-solution-generator`
# env var is set for tests in this package, which is why the CLI integration
# tests live here too.
[[bin]]
name = "unity-solution-generator"
path = "src/main.rs"

[dependencies]
walkdir.workspace = true
ignore.workspace = true
rayon.workspace = true
libc.workspace = true
serde_json.workspace = true
flate2 = "1"
tar = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "generate"
harness = false

[[bench]]
name = "scan"
harness = false

[[bench]]
name = "lockfile"
harness = false
