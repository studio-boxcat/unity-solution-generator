[workspace]
resolver = "2"
members = ["crates/usg-core"]

[workspace.package]
version = "0.6.0"
edition = "2021"
# 1.89 stabilized std::fs::File::{lock, try_lock, unlock} which package_cache.rs
# uses for cross-platform advisory locking (replaces libc::flock).
rust-version = "1.89"

[workspace.dependencies]
walkdir = "2"
rayon = "1.10"
serde_json = "1"
# Windows-safe canonicalize: `std::fs::canonicalize` returns `\\?\` UNC paths on
# Windows that break downstream string-path operations. `dunce::canonicalize`
# strips that prefix transparently and is a no-op on Unix.
dunce = "1"
# Atomic file writes via NamedTempFile::persist (replaces hand-rolled rename).
tempfile = "3"
# Shared Watchman wire layer (sync facade over watchman_client + tokio, both
# pulled transitively). `scan.rs` is a thin wrapper pinning the project-scan
# dir/suffix filter on top of `unity_watch::{enumerate, init_socket_env}`.
unity-watch = { git = "https://github.com/studio-boxcat/unity-watch.git" }
# Context-chained errors. `ScanError::Query` carries the `anyhow::Error` that
# `unity_watch::WatchError::Query` produces.
anyhow = "1"
# Typed error enums; `ScanError` in `scan.rs`.
thiserror = "2"
# Compact binary codec for the `scan-cache` file. Native `Encode`/`Decode`
# derives — no serde required. Saves ~120 LOC of hand-rolled text codec.
bincode = "2"

# `panic = "unwind"` (the default) is required by FFI hosts that wrap calls
# in `catch_unwind` (e.g. meow-tower's BoxcatBridge). Don't set "abort" here.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
